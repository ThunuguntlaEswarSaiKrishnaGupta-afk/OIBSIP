name: Deploy Personal Portfolio

on:
  push:
    branches:
      - main
    paths:
      - 'WebDev-L1-PersonalPortfolio/**'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare portfolio files
        run: |
          mkdir public
          cp -r WebDev-L1-PersonalPortfolio/. public/

      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
