<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="converter-card">
    <h1>Temperature Converter</h1>
    <p class="subtitle">Convert between Celsius, Fahrenheit, and Kelvin</p>

    <div class="input-group">
      <label for="tempValue">Enter Temperature</label>
      <input type="text" id="tempValue" placeholder="e.g. 25" />
    </div>

    <div class="input-group">
      <label for="unitSelect">Select Unit</label>
      <select id="unitSelect">
        <option value="celsius">Celsius (°C)</option>
        <option value="fahrenheit">Fahrenheit (°F)</option>
        <option value="kelvin">Kelvin (K)</option>
      </select>
    </div>

    <button onclick="convertTemperature()" class="convert-btn">Convert</button>

    <div id="errorMessage" class="error-message"></div>

    <div id="resultBox" class="result-box" style="display: none;">
      <div class="result-row">
        <span class="result-label">Celsius:</span>
        <span id="resultCelsius" class="result-value"></span>
      </div>
      <div class="result-row">
        <span class="result-label">Fahrenheit:</span>
        <span id="resultFahrenheit" class="result-value"></span>
      </div>
      <div class="result-row">
        <span class="result-label">Kelvin:</span>
        <span id="resultKelvin" class="result-value"></span>
      </div>
    </div>
  </div>

  <script>
    // Format a number to 2 decimals, and avoid showing "-0.00"
    function formatNumber(n) {
      const text = n.toFixed(2);
      return text === '-0.00' ? '0.00' : text;
    }

    function convertTemperature() {
      const inputVal = document.getElementById('tempValue').value.trim();
      const unit = document.getElementById('unitSelect').value;
      const errorBox = document.getElementById('errorMessage');
      const resultBox = document.getElementById('resultBox');

      // Reset previous state
      errorBox.textContent = '';
      resultBox.style.display = 'none';

      // Validate: only plain numbers are allowed (e.g. 25, -40, 98.6, .5)
      // This rejects empty input, letters, hex like 0x10, and the word "Infinity"
      const validNumber = /^[+-]?(\d+(\.\d*)?|\.\d+)$/;
      if (!validNumber.test(inputVal)) {
        errorBox.textContent = 'Please enter a valid number.';
        return;
      }

      const value = Number(inputVal);

      // Guard against numbers so large they overflow to Infinity
      if (!Number.isFinite(value)) {
        errorBox.textContent = 'That number is too large. Please enter a smaller value.';
        return;
      }

      let celsius, fahrenheit, kelvin;

      // Convert input value to Celsius first (as a common base)
      if (unit === 'celsius') {
        celsius = value;
      } else if (unit === 'fahrenheit') {
        celsius = (value - 32) * (5 / 9);
      } else if (unit === 'kelvin') {
        celsius = value - 273.15;
      }

      // Check for absolute zero violation.
      // A tiny tolerance (1e-9) stops decimal rounding errors from rejecting
      // exact absolute zero, e.g. -459.67 °F.
      const ABSOLUTE_ZERO_C = -273.15;
      if (celsius < ABSOLUTE_ZERO_C - 1e-9) {
        errorBox.textContent = 'Temperature cannot be below absolute zero (-273.15°C).';
        return;
      }

      // Now calculate all three units from Celsius
      fahrenheit = (celsius * 9 / 5) + 32;
      kelvin = celsius + 273.15;

      // Display results, rounded to 2 decimal places
      document.getElementById('resultCelsius').textContent = formatNumber(celsius) + ' °C';
      document.getElementById('resultFahrenheit').textContent = formatNumber(fahrenheit) + ' °F';
      document.getElementById('resultKelvin').textContent = formatNumber(kelvin) + ' K';

      resultBox.style.display = 'block';
    }
  </script>

</body>
</html>
